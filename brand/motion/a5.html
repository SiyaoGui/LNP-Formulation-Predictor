<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LipidLens motion a5</title><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&display=swap" rel="stylesheet"><style>
:root{--ease-settle:cubic-bezier(0.2,0,0,1);--ease-draw:cubic-bezier(0.4,0,0.2,1);--t-short:200ms;--t-mid:600ms;--t-long:1200ms}
.anim .m{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){
 .anim.play .asm{animation:asm var(--t-mid) var(--ease-settle) both;animation-delay:var(--d)}
 @keyframes asm{from{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}to{transform:none;opacity:1}}
 .anim.play .enter{animation:enter var(--t-long) var(--ease-draw) both .3s}
 @keyframes enter{from{transform:translate(-330px,0)}to{transform:none}}
 .anim.play .close{animation:close var(--t-mid) var(--ease-settle) both 1.5s}
 @keyframes close{from{stroke-dashoffset:var(--gap)}to{stroke-dashoffset:0}}
 .anim.play .fade{animation:fade var(--t-mid) var(--ease-settle) both;animation-delay:var(--d,0s)}
 @keyframes fade{from{opacity:0}to{opacity:1}}
 .anim.play .slide{animation:slidedown var(--t-long) var(--ease-settle) both .3s}
 @keyframes slidedown{from{transform:translate(0,-170px)}to{transform:none}}
 .anim.play .led{animation:led var(--t-short) linear both 1.6s}
 @keyframes led{from{fill:#8FA994}to{fill:#E9EFE7}}
 .anim.play .draw{stroke-dasharray:var(--len);animation:draw var(--t-long) var(--ease-draw) both;animation-delay:var(--d,0s)}
 @keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
 .anim.play .drop{animation:drop var(--t-mid) var(--ease-settle) both;animation-delay:var(--d)}
 @keyframes drop{from{transform:translate(0,-60px);opacity:0}to{transform:none;opacity:1}}
 .anim.play .grow{transform-box:fill-box;transform-origin:center;animation:grow var(--t-mid) var(--ease-settle) both;animation-delay:var(--d)}
 @keyframes grow{from{transform:scaleY(0)}to{transform:none}}
 .anim .seg{transition:x var(--t-mid) var(--ease-settle),width var(--t-mid) var(--ease-settle)}
}
.anim text{font-family:Archivo,'Noto Sans SC',Arial,sans-serif}
body{margin:0;padding:16px;background:#FBFAF6;font-family:Archivo,sans-serif;color:#1B211E}svg{width:100%;max-width:780px;height:auto;display:block}button{font:600 14px Archivo,sans-serif;padding:8px 12px;border:1px solid #3A5442;background:#fff;color:#2A3D31;margin:8px 6px 0 0}button[aria-pressed=true]{background:#3A5442;color:#fff}</style></head><body><h1 style="font-size:18px">数据：预测点落位，不确定度区间展开</h1><div><svg id="a5" class="anim" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Illustrative chart: predicted values placed against a one-to-one line with an uncertainty band"><defs>
<radialGradient id="gHead" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#B6CCF1"/><stop offset="0.55" stop-color="#6F95D8"/><stop offset="1" stop-color="#3D62A6"/></radialGradient>
<radialGradient id="gIon" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#A7D6D6"/><stop offset="0.55" stop-color="#4FA3A5"/><stop offset="1" stop-color="#2C6E70"/></radialGradient>
<radialGradient id="gDrug" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#F8D9D3"/><stop offset="0.6" stop-color="#E9A69C"/><stop offset="1" stop-color="#B9685D"/></radialGradient>
<radialGradient id="gMol" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#E1F0D6"/><stop offset="0.6" stop-color="#A9CF90"/><stop offset="1" stop-color="#6E9C55"/></radialGradient>
<linearGradient id="gProt" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#9FA2C8"/><stop offset="0.35" stop-color="#F1F1FA"/><stop offset="0.7" stop-color="#DADBEE"/><stop offset="1" stop-color="#9FA2C8"/></linearGradient>
<linearGradient id="gChol" x1="0" x2="1"><stop offset="0" stop-color="#857953"/><stop offset="0.4" stop-color="#E2D8B8"/><stop offset="1" stop-color="#B7A983"/></linearGradient>
<radialGradient id="gCore" cx="0.45" cy="0.4" r="0.7"><stop offset="0" stop-color="#FBF3DC"/><stop offset="1" stop-color="#EAD9A6"/></radialGradient>
<filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="4"/><feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2A3D31"/></marker>
</defs><rect width="520" height="300" fill="#FBFAF6"/><line x1="60" y1="260" x2="260" y2="260" stroke="#4F5853"/><line x1="60" y1="260" x2="60" y2="60" stroke="#4F5853"/><polygon points="60,242 242,60 260,60 260,78 78,260 60,260" fill="#A7BFAE" opacity="0.35" class="grow" style="--d:2.6s"/><line x1="60" y1="260" x2="260" y2="60" stroke="#1B211E" stroke-width="1.5" class="draw" style="--len:283;--d:0s"/><circle cx="80" cy="234" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:1.10s"/><circle cx="105" cy="198" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:1.28s"/><circle cx="130" cy="198" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:1.46s"/><circle cx="150" cy="155" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:1.64s"/><circle cx="180" cy="168" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:1.82s"/><circle cx="200" cy="110" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:2.00s"/><circle cx="225" cy="102" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:2.18s"/><circle cx="245" cy="110" r="5.5" fill="none" stroke="#3B7DA6" stroke-width="2" class="drop" style="--d:2.36s"/><text x="60" y="284" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:12px;font-weight:400;fill:#4F5853">Measured</text><text x="66" y="54" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:12px;font-weight:400;fill:#4F5853">Predicted</text><rect x="300" y="70" width="200" height="26" fill="#F2EFE3" stroke="#1B211E"/><text x="400" y="88" text-anchor="middle" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:12px;font-weight:700;fill:#1B211E">ILLUSTRATIVE DATA</text><text x="300" y="130" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:12px;font-weight:400;fill:#4F5853">Hollow = predicted</text><text x="300" y="150" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:12px;font-weight:400;fill:#4F5853">Band = plus or minus 10%</text><text x="300" y="170" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:12px;font-weight:400;fill:#4F5853">No independent lab data yet</text><text x="20" y="30" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:14px;font-weight:400;fill:#4F5853">How prediction accuracy will be shown.</text></svg><p class="ctl"><button data-replay="a5">Replay</button></p></div><script>
(function(){
 var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function play(el){el.classList.remove('play');void el.getBoundingClientRect();el.classList.add('play');}
 document.querySelectorAll('svg.anim').forEach(function(el){
  if(reduce) return;
  if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){play(el);io.disconnect();}})},{threshold:.4});io.observe(el);} else play(el);
 });
 document.querySelectorAll('[data-replay]').forEach(function(b){b.addEventListener('click',function(){var el=document.getElementById(b.dataset.replay);if(!reduce)play(el);});});
 // selectivity: switch target membrane
 var S={A:{mem:[.45,.20,.25,.10],rec:[.40,.20,.35,.05],name:'Target A: e.g. blood-brain barrier endothelium'},
        B:{mem:[.30,.10,.15,.45],rec:[.50,.10,.385,.015],name:'Target B: e.g. liver cell'}};
 function setT(svg,k){var s=S[k];['mem','rec'].forEach(function(row){var x=+svg.dataset[row+'x'],w=+svg.dataset[row+'w'];
   s[row].forEach(function(f,i){var r=svg.querySelector('#'+row+i);r.setAttribute('x',x.toFixed(1));r.setAttribute('width',(f*w).toFixed(1));x+=f*w;});});
   svg.querySelector('#tname').textContent=s.name;
   svg.parentNode.querySelectorAll('[data-t]').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.t===k)});}
 document.querySelectorAll('svg.select').forEach(function(svg){
   var k='A';setT(svg,k);
   svg.parentNode.querySelectorAll('[data-t]').forEach(function(b){b.addEventListener('click',function(){k=b.dataset.t;setT(svg,k);})});
   if(!reduce){var t=setInterval(function(){if(!document.hidden){k=(k==='A'?'B':'A');setT(svg,k);}},4200);
     svg.parentNode.querySelectorAll('[data-t]').forEach(function(b){b.addEventListener('click',function(){clearInterval(t)})});}
 });
})();
</script></body></html>
