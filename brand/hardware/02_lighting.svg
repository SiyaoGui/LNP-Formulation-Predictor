<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-label="Lighting setup for hardware photos"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2A3D31"/></marker></defs><rect width="900" height="570" fill="#FBFAF6"/><text x="30" y="40" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:20px;font-weight:600;fill:#1B211E">Lighting: one soft key light, one white fill, plain background</text><text x="30" y="64" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:14px;font-weight:400;fill:#4F5853">Same light direction as the scientific illustrations: from the upper left.</text><path d="M120 470 Q120 200 420 200 H760" fill="none" stroke="#B4BAB5" stroke-width="10"/><text x="470" y="180" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:400;fill:#4F5853">Background: paper white or light green (g100), one seamless sweep</text><polygon points="420.0,300.0 523.9,360.0 454.6,400.0 350.7,340.0" fill="#56715F" stroke="#1B211E" stroke-width="1"/><polygon points="350.7,400.0 454.6,460.0 454.6,400.0 350.7,340.0" fill="#3A5442" stroke="#1B211E" stroke-width="1"/><polygon points="523.9,420.0 454.6,460.0 454.6,400.0 523.9,360.0" fill="#2C4234" stroke="#1B211E" stroke-width="1"/><rect x="140" y="110" width="120" height="80" rx="4" fill="#FFFFFF" stroke="#1B211E" transform="rotate(-25 200 150)"/><text x="130" y="230" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:600;fill:#1B211E">Key: large softbox,</text><text x="130" y="248" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:400;fill:#4F5853">upper left, 45°</text><path d="M260 180 L380 290" stroke="#2A3D31" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="700" y="330" width="16" height="130" fill="#FFFFFF" stroke="#1B211E"/><text x="728" y="380" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:600;fill:#1B211E">Fill: white foam</text><text x="728" y="398" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:400;fill:#4F5853">board, right side</text><text x="30" y="540" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:14px;font-weight:400;fill:#4F5853">No coloured gels, no rim light, no glow, no dark background with spotlights. Free option: window light plus a white board.</text></svg>