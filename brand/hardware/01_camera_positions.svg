<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" role="img" aria-label="Camera positions for hardware photos and renders"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2A3D31"/></marker></defs><rect width="900" height="600" fill="#FBFAF6"/><text x="30" y="40" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:20px;font-weight:600;fill:#1B211E">Camera positions, seen from above</text><text x="30" y="64" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:14px;font-weight:400;fill:#4F5853">One standard set of four shots for every hardware version.</text><rect x="400" y="245" width="140" height="90" fill="#3A5442"/><text x="470" y="295" text-anchor="middle" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:600;fill:#FBFAF6">module</text><circle cx="170" cy="460" r="16" fill="#F2EFE3" stroke="#2A3D31" stroke-width="2"/><path d="M170 460 L374 344" stroke="#2A3D31" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="154" y="500" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:15px;font-weight:600;fill:#1B211E">1  Hero: 3/4 view</text><text x="154" y="520" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:400;fill:#4F5853">45° to the side, 30° above, 50 mm equivalent</text><circle cx="470" cy="520" r="16" fill="#F2EFE3" stroke="#2A3D31" stroke-width="2"/><path d="M470 520 L470 364" stroke="#2A3D31" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="496" y="518" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:15px;font-weight:600;fill:#1B211E">2  Front</text><text x="496" y="538" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:400;fill:#4F5853">straight on, at module height, orthographic look</text><circle cx="470" cy="80" r="16" fill="#F2EFE3" stroke="#2A3D31" stroke-width="2"/><path d="M470 80 L470 223" stroke="#2A3D31" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="496" y="78" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:15px;font-weight:600;fill:#1B211E">3  Top</text><text x="496" y="98" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:400;fill:#4F5853">straight down, for layout and ports</text><circle cx="670" cy="410" r="16" fill="#F2EFE3" stroke="#2A3D31" stroke-width="2"/><path d="M670 410 L534 328" stroke="#2A3D31" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ar)"/><text x="696" y="408" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:15px;font-weight:600;fill:#1B211E">4  Detail</text><text x="696" y="428" text-anchor="start" style="font-family:Archivo,'Noto Sans SC',Arial,sans-serif;font-size:13px;font-weight:400;fill:#4F5853">close-up of sensor window or connector</text></svg>